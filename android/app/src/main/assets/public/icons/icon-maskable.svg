<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgMaskable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="sunGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cloudGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable safety zone (80% inner content) -->
  <rect width="512" height="512" fill="url(#bgMaskable)" />

  <!-- Sun in safe zone -->
  <circle cx="310" cy="200" r="54" fill="url(#sunGradMask)" />
  
  <!-- Cloud in safe zone -->
  <path d="M175 345h165a54 54 0 0 0 10-106.8 72 72 0 0 0-140-17.2A50 50 0 0 0 175 345z" fill="url(#cloudGradMask)" />

  <!-- Rain Accents in safe zone -->
  <circle cx="210" cy="385" r="7" fill="#38bdf8" />
  <circle cx="258" cy="392" r="7" fill="#34d399" />
  <circle cx="306" cy="385" r="7" fill="#38bdf8" />
</svg>
