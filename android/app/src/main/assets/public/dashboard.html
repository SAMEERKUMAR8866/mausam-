<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Mausam Dashboard</title><script>
      try {
        var prefsStr = localStorage.getItem('mausam_user_prefs');
        var legacyOnboarded = localStorage.getItem('mausam_onboarding_completed');
        var completed = false;
        if (prefsStr) {
          var parsed = JSON.parse(prefsStr);
          completed = parsed.onboardingCompleted === true;
        } else if (legacyOnboarded === 'true') {
          completed = true;
        }
        if (!completed && !window.location.search.includes('bypass_onboarding')) {
          window.location.replace('/onboarding.html');
        } else {
          window.location.replace('/index.html');
        }
      } catch (e) {
        window.location.replace('/index.html');
      }
    </script></head><body class="bg-[#070b14] text-white flex items-center justify-center min-h-screen"><p class="text-sm text-slate-400">Redirecting to personalized Mausam dashboard...</p></body></html>
