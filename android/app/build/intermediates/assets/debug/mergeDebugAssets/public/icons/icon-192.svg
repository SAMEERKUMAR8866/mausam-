<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Sun Glow & Core -->
  <circle cx="124" cy="68" r="28" fill="url(#sunGrad)" opacity="0.9" filter="url(#glow)" />
  <circle cx="124" cy="68" r="24" fill="url(#sunGrad)" />

  <!-- Sun Rays -->
  <path d="M124 28v10M124 98v10M84 68h10M154 68h10M96 40l7 7M145 89l7 7M96 96l7-7M145 47l7-7" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />

  <!-- Cloud Shape with Emerald/Cyan Glow -->
  <path d="M62 142h74a26 26 0 0 0 5-51.5 34 34 0 0 0-66-8A24 24 0 0 0 62 142z" fill="url(#cloudGrad)" opacity="0.25" filter="url(#glow)" />
  <path d="M62 138h74a24 24 0 0 0 4-47.6 32 32 0 0 0-62-7.5A22 22 0 0 0 62 138z" fill="url(#cloudGrad)" />

  <!-- Rain Drops / Sparkles -->
  <circle cx="76" cy="154" r="3.5" fill="#38bdf8" opacity="0.9" />
  <circle cx="98" cy="158" r="3.5" fill="#34d399" opacity="0.9" />
  <circle cx="120" cy="154" r="3.5" fill="#38bdf8" opacity="0.9" />
</svg>
